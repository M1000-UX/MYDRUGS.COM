<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mydrugs.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #0f0f0f;
      color: #f1f1f1;
    }
    header {
      background-color: #1e1e1e;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      color: #00ff88;
    }
    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #f1f1f1;
      font-weight: bold;
    }
    .container {
      display: flex;
    }
    .sidebar {
      width: 200px;
      background-color: #161616;
      padding: 20px;
      border-right: 1px solid #333;
    }
    .sidebar h2 {
      font-size: 18px;
      margin-top: 0;
    }
    .stock-item {
      margin-bottom: 15px;
    }
    .stock-bar {
      height: 10px;
      background: #333;
      border-radius: 5px;
      overflow: hidden;
    }
    .stock-fill {
      height: 10px;
      background: #00ff88;
    }
    .main {
      flex: 1;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    .product-card {
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 5px #000;
    }
    .product-card img {
      width: 100%;
      border-radius: 8px;
    }
    .product-card h3 {
      font-size: 18px;
      margin: 10px 0 5px;
    }
    .product-card p {
      margin: 5px 0;
    }
    .product-card button {
      margin-top: 10px;
      background: #00ff88;
      color: #000;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    .product-card button:hover {
      background: #00cc6f;
    }
  </style>
</head>
<body>
  <header>
    <h1>mydrugs.com</h1>
    <nav>
      <a href="#">Anasayfa</a>
      <a href="#">Ürünler</a>
      <a href="#">Sepet</a>
      <a href="#">Destek</a>
    </nav>
  </header>
  <div class="container">
    <aside class="sidebar">
      <h2>Depo</h2>
      <div class="stock-item">
        <p>Adderall</p>
        <div class="stock-bar"><div class="stock-fill" style="width: 80%"></div></div>
      </div>
      <div class="stock-item">
        <p>Ritalin</p>
        <div class="stock-bar"><div class="stock-fill" style="width: 60%"></div></div>
      </div>
      <div class="stock-item">
        <p>Xanax</p>
        <div class="stock-bar"><div class="stock-fill" style="width: 40%"></div></div>
      </div>
    </aside>
    <main class="main">
      <div class="product-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/Adderall_tablets.jpg/320px-Adderall_tablets.jpg" alt="Adderall">
        <h3>Adderall</h3>
        <p>Fiyat: ₺200</p>
        <button onclick="alert('Sepete eklendi: Adderall')">Sepete Ekle</button>
      </div>
      <div class="product-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Ritalin_tablets.jpg/320px-Ritalin_tablets.jpg" alt="Ritalin">
        <h3>Ritalin</h3>
        <p>Fiyat: ₺180</p>
        <button onclick="alert('Sepete eklendi: Ritalin')">Sepete Ekle</button>
      </div>
      <div class="product-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/Xanax_2_mg.jpg/320px-Xanax_2_mg.jpg" alt="Xanax">
        <h3>Xanax</h3>
        <p>Fiyat: ₺150</p>
        <button onclick="alert('Sepete eklendi: Xanax')">Sepete Ekle</button>
      </div>
    </main>
  </div>
</body>
</html>
